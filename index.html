<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>人生倒计时</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="home-screen" id="home-screen">
    <div class="wallpaper-glow glow-one"></div><div class="wallpaper-glow glow-two"></div>
    <header class="status-bar">
      <div class="status-left"><span id="desktop-time">--:--</span><span id="desktop-date">--月--日</span></div>
      <div class="status-right"><span class="status-focus">专注模式</span><span class="wifi-mark">⌁</span><span class="battery"><i></i></span></div>
    </header>
    <section class="home-content">
      <div class="home-greeting">
        <p class="home-date" id="home-date">今天</p>
        <h1>把时间，留给重要的事。</h1>
        <p>每一天都值得认真度过。</p>
      </div>
      <button class="life-widget" data-open-app="life" type="button">
        <div class="widget-top"><span class="widget-kicker">LIFE COUNTDOWN</span><span class="widget-arrow">↗</span></div>
        <div class="widget-main"><div><strong id="widget-age">人生 · -- 岁</strong><span id="widget-birthday">正在计算你的时间</span></div><div class="widget-ring"><span>人生<br>进度</span></div></div>
        <div class="widget-track"><i id="widget-progress"></i></div>
        <div class="widget-foot"><span>珍惜此刻</span><span id="widget-remaining">每一天都很重要</span></div>
      </button>
      <div class="desktop-apps">
        <button class="app-icon" data-open-app="life" type="button"><span class="app-glyph life-glyph">◷</span><b>人生倒计时</b></button>
        <button class="app-icon" data-open-app="calendar" type="button"><span class="app-glyph calendar-glyph"><small id="icon-month">11月</small><strong id="icon-day">22</strong></span><b>生命日历</b></button>
        <button class="app-icon" data-open-app="settings" type="button"><span class="app-glyph settings-glyph">⚙</span><b>设置</b></button>
      </div>
    </section>
    <nav class="dock" aria-label="应用程序坞">
      <button class="dock-app life-glyph" data-open-app="life" aria-label="人生倒计时">◷</button>
      <button class="dock-app calendar-glyph" data-open-app="calendar" aria-label="生命日历">▦</button>
      <button class="dock-app settings-glyph" data-open-app="settings" aria-label="设置">⚙</button>
    </nav>
    <div class="home-indicator"></div>
  </main>
  <section class="app-window" id="app-window" aria-label="人生倒计时应用" hidden>
    <div class="window-toolbar">
      <button class="window-control close-window" id="home-button" type="button" aria-label="返回桌面">⌂</button>
      <div class="window-title">人生倒计时</div>
      <button class="window-control" id="window-settings" type="button" aria-label="设置">⚙</button>
    </div>
      <main class="app" aria-label="人生倒计时">
    <header class="topbar">
      <div class="brand-block">
        <div>
          <h1>人生倒计时</h1>
          <p id="profile-line">出生 -- · 预期 -- 岁</p>
        </div>
      </div>
      <button class="icon-button" id="settings-button" type="button" aria-label="打开设置" title="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.08-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.36 7.36 0 0 0-1.69-.98L14.5 2.42A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.49.42L9.13 5.07c-.61.25-1.18.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.05.32-.08.65-.08.98s.03.65.08.97l-2.11 1.66a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.51.4 1.08.73 1.69.98l.38 2.65A.5.5 0 0 0 10 22h4a.5.5 0 0 0 .49-.42l.38-2.65a7.36 7.36 0 0 0 1.69-.98l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
      </button>
    </header>

    <section class="life-panel" aria-labelledby="life-scale-title">
      <div class="scale-block">
        <div class="section-heading">
          <div>
            <span class="eyebrow">LIFE SCALE</span>
            <h2 id="life-scale-title">人生刻度</h2>
          </div>
          <div class="legend" aria-label="刻度图例">
            <span><i class="legend-dot past"></i>已走过</span>
            <span><i class="legend-dot current"></i>当前</span>
            <span><i class="legend-dot future"></i>未来</span>
          </div>
        </div>
        <div class="life-scale-wrap">
          <div class="current-age-badge" id="current-age-badge">-- 岁</div>
          <div class="life-scale" id="life-scale" aria-label="人生年龄刻度"></div>
          <div class="scale-labels" id="scale-labels" aria-hidden="true"></div>
        </div>
      </div>

      <div class="rings" aria-label="倒计时概览">
        <article class="ring-card featured">
          <div class="progress-ring blue" id="age-ring" role="img" aria-label="当前这一岁剩余比例">
            <div class="ring-hole"><strong id="birthday-days">--</strong><span>天</span></div>
          </div>
          <div class="ring-copy"><b id="next-age-label">距下一岁</b><span id="age-percent">--%</span></div>
        </article>
        <article class="ring-card">
          <div class="progress-ring amber" id="year-ring" role="img" aria-label="本年度剩余比例">
            <div class="ring-hole"><strong id="year-percent">--</strong><span>%</span></div>
          </div>
          <div class="ring-copy"><b>本年剩余</b><span id="year-days-left">--</span></div>
        </article>
      </div>
    </section>

    <section class="calendar-panel" aria-labelledby="calendar-title">
      <div class="calendar-header">
        <div>
          <span class="eyebrow">YEAR AT A GLANCE</span>
          <h2 id="calendar-title"><span id="calendar-year">----</span> 年完整日历</h2>
        </div>
        <div class="calendar-legend" aria-label="日历图例">
          <span><i class="day-key past"></i>已过去</span>
          <span><i class="day-key today"></i>今天</span>
          <span><i class="day-key future"></i>未来</span>
        </div>
      </div>
      <div class="year-grid" id="year-grid" aria-label="全年十二个月日历"></div>
    </section>
  </main>
  </section>

  <div class="modal" id="settings-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-heading">
        <div><span class="eyebrow">SETTINGS</span><h2 id="settings-title">倒计时设置</h2></div>
        <button class="modal-close" id="close-settings" type="button" aria-label="关闭">×</button>
      </div>
      <form id="settings-form" novalidate>
        <label for="birth-input">出生日期</label>
        <input id="birth-input" type="date" required>
        <label for="age-input">预期年龄</label>
        <div class="number-input-wrap"><input id="age-input" type="number" min="1" max="120" step="1" required><span>岁</span></div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="modal-actions">
          <button class="button ghost" id="reset-settings" type="button">恢复默认</button>
          <button class="button primary" type="submit">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
